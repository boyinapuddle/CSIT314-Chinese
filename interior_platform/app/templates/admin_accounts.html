{% extends 'base.html' %}
{% block content %}
<section class="section">
    <div class="section-head">
        <div>
            <p class="eyebrow dark">USER ADMIN</p>
            <h1>User Accounts</h1>
        </div>
        <form class="search">
            <input name="q" value="{{ request.args.get('q', '') }}" placeholder="Search accounts">
            <button>Search</button>
        </form>
    </div>

    <div class="split">
        <form class="panel" method="post">
            <h3>Create account</h3>
            <label>Username<input name="username" required></label>
            <label>Password<input type="password" name="password" required></label>
            <label>Display name<input name="display_name" required></label>
            <label>Email<input type="email" name="email" required></label>
            <label>
                Profile
                <select name="profile_id">
                    {% for p in profiles if p.status == 'Active' %}
                    <option value="{{ p.profile_id }}">{{ p.name }}</option>
                    {% endfor %}
                </select>
            </label>
            <button class="btn">Create account</button>
        </form>

        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>User</th>
                        <th>Profile</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    {% for x in items %}
                    <tr>
                        <td>
                            <b>{{ x.display_name }}</b><br>
                            <small>{{ x.username }} · {{ x.email }}</small>
                        </td>
                        <td>{{ x.role }}</td>
                        <td><span class="status {{ x.status|lower }}">{{ x.status }}</span></td>
                        <td>
                            <button class="link" data-toggle="account-{{ x.account_id }}">Edit</button>
                            {% if x.status == 'Active' %}
                            <form class="inline" method="post" action="{{ url_for('main.suspend_account', account_id=x.account_id) }}">
                                <button class="link danger">Suspend</button>
                            </form>
                            {% endif %}
                        </td>
                    </tr>
                    <tr id="account-{{ x.account_id }}" class="edit-row hidden">
                        <td colspan="4">
                            <form class="inline-edit" method="post" action="{{ url_for('main.edit_account', account_id=x.account_id) }}">
                                <input name="display_name" value="{{ x.display_name }}">
                                <input name="email" value="{{ x.email }}">
                                <select name="profile_id">
                                    {% for p in profiles %}
                                    <option value="{{ p.profile_id }}" {% if p.profile_id == x.profile_id %}selected{% endif %}>{{ p.name }}</option>
                                    {% endfor %}
                                </select>
                                <button class="btn small">Save</button>
                            </form>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</section>
{% endblock %}
