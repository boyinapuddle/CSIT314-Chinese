{% extends 'base.html' %}{% block content %}<section class="section"><p class="eyebrow dark">PROJECT INTEREST</p><h1>Views & Shortlists</h1><div class="metric-grid">{% for p in items %}<article><span>{{p.project_status}} · {{p.category_name}}</span><h3>{{p.title}}</h3><div class="metric-pair"><div><strong>{{p.views}}</strong><small>Views</small></div><div><strong>{{p.shortlists}}</strong><small>Shortlists</small></div></div></article>{% else %}<div class="empty">Create a project to start tracking interest.</div>{% endfor %}</div></section>{% endblock %}
