{% extends 'base.html' %}
{% block content %}
<section class="section">
    <div class="section-head">
        <div>
            <p class="eyebrow dark">USER ADMIN</p>
            <h1>User Profiles</h1>
        </div>
        <form class="search">
            <input name="q" value="{{ request.args.get('q', '') }}" placeholder="Search profiles">
            <button>Search</button>
        </form>
    </div>

    <div class="split">
        <form class="panel" method="post">
            <h3>Create profile</h3>
            <label>
                Profile name
                <input name="name" required placeholder="e.g. Customer">
            </label>
            <label>
                Description
                <textarea name="description"></textarea>
            </label>
            <button class="btn">Create profile</button>
        </form>

        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Description</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    {% for x in items %}
                    <tr>
                        <td>{{ x.name }}</td>
                        <td>{{ x.description }}</td>
                        <td><span class="status {{ x.status|lower }}">{{ x.status }}</span></td>
                        <td>
                            <button class="link" data-toggle="profile-{{ x.profile_id }}">Edit</button>
                            {% if x.status == 'Active' %}
                            <form class="inline" method="post" action="{{ url_for('main.suspend_profile', profile_id=x.profile_id) }}">
                                <button class="link danger">Suspend</button>
                            </form>
                            {% endif %}
                        </td>
                    </tr>
                    <tr id="profile-{{ x.profile_id }}" class="edit-row hidden">
                        <td colspan="4">
                            <form class="inline-edit" method="post" action="{{ url_for('main.edit_profile', profile_id=x.profile_id) }}">
                                <input name="name" value="{{ x.name }}">
                                <input name="description" value="{{ x.description }}">
                                <button class="btn small">Save</button>
                            </form>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</section>
{% endblock %}
