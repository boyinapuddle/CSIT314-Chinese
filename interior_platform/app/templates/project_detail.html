{% extends 'base.html' %}{% block content %}<section class="project-detail"><div class="detail-image" style="background-image:url('{{p.image_url}}')"></div><div class="detail-copy"><p class="eyebrow dark">{{p.category_name}} · {{p.project_status}}</p><h1>{{p.title}}</h1><p class="lede">{{p.description}}</p><div class="progress"><div style="width:{{p.progress}}%"></div></div><p>{{p.progress}}% progress · Last updated {{p.updated_at[:10]}}</p><h3>{{p.company_name or p.designer_name}}</h3><form method="post" action="{{url_for('main.save_project',pid=p.project_id)}}"><button class="btn">♡ Save to favourites</button></form></div></section>{% endblock %}
